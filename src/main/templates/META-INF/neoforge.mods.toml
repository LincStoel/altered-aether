modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="aether"
type="required"
versionRange="[1.5.10,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="aeroblender"
type="required"
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

# Optional integration: loading after it lets our Aether spawn rules attach to its own.
[[dependencies."${mod_id}"]]
modId="ars_nouveau"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

# Optional integration: loading after it lets our Aether spawn rules attach to its own.
[[dependencies."${mod_id}"]]
modId="ars_elemental"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

# Optional integration: loading after it lets our Aether spawn rules attach to its own.
[[dependencies."${mod_id}"]]
modId="snuffles"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

# Optional integration: loading after it lets our Aether spawn rules attach to its own.
[[dependencies."${mod_id}"]]
modId="deep_aether"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

# Optional integration: loading after it lets our Aether spawn rules attach to its own.
[[dependencies."${mod_id}"]]
modId="mowziesmobs"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"
